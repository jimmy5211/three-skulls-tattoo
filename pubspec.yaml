name: three_skulls_tattoo
‎description: Three Skulls Tattoo App
‎
‎publish_to: 'none'
‎
‎version: 1.0.0+1
‎
‎environment:
‎  sdk: '>=3.0.0 <4.0.0'
‎
‎dependencies:
‎  flutter:
‎    sdk: flutter
‎  
‎  # Navegación
‎  go_router: ^13.0.0
‎  
‎  # Animaciones
‎  animated_splash_screen: ^1.3.0
‎  lottie: ^3.0.0
‎  
‎  # Iconos
‎  flutter_svg: ^2.0.9
‎  
‎  # Google Drive y Auth
‎  google_sign_in: ^6.2.1
‎  googleapis: ^12.0.0
‎  
‎  # Almacenamiento local
‎  shared_preferences: ^2.2.2
‎  
‎  # Permisos
‎  permission_handler: ^11.3.0
‎
‎dev_dependencies:
‎  flutter_test:
‎    sdk: flutter
‎  flutter_lints: ^3.0.0
‎
‎flutter:
‎  uses-material-design: true
‎  
‎  assets:
‎    - assets/images/
‎    - assets/animations/
‎  
‎  fonts:
‎    - family: BlackOpsOne
‎      fonts:
‎        - asset: assets/fonts/BlackOpsOne-Regular.ttf
‎    - family: Raleway
‎      fonts:
‎        - asset: assets/fonts/Raleway-Regular.ttf
‎        - asset: assets/fonts/Raleway-Bold.ttf
