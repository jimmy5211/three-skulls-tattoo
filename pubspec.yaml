name: three_skulls_tattoo
description: Three Skulls Tattoo App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navegación
  go_router: ^13.0.0

  # UI
  animated_splash_screen: ^1.3.0
  lottie: ^3.0.0
  flutter_svg: ^2.0.9

  # Google
  google_sign_in: ^6.2.1
  googleapis: ^12.0.0

  # Storage / permisos
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
  path_provider: ^2.1.2

  # Utilidades
  uuid: ^4.3.3
  image_picker: ^1.0.7
  image: ^4.1.7
  http: ^1.2.0
  file_picker: ^8.0.3
  open_file: ^3.3.2
  package_info_plus: ^8.0.0

  # 🔥 NUEVO (UPDATE SYSTEM)
  dio: ^5.4.0

  # 🔔 NOTIFICACIONES
  flutter_local_notifications: ^17.0.0

  # 🔄 BACKGROUND TASKS
  workmanager: ^0.5.2

  # 🔥 FIREBASE
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: BlackOpsOne
      fonts:
        - asset: assets/fonts/BlackOpsOne-Regular.ttf

    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Regular.ttf
        - asset: assets/fonts/Raleway-Bold.ttf
