import 'dart:convert';
import 'package:flutter/material.dart';
import 'package:workmanager/workmanager.dart';
import 'package:dio/dio.dart';
import 'package:package_info_plus/package_info_plus.dart';
import 'package:flutter_local_notifications/flutter_local_notifications.dart';
import 'package:shared_preferences/shared_preferences.dart';

// 🔔 Notificaciones
final FlutterLocalNotificationsPlugin notificationsPlugin =
    FlutterLocalNotificationsPlugin();

// 📡 URL de tu JSON (el mismo que ya usas)
const String updateUrl =
    "https://api.jsonbin.io/v3/b/69b8b65eaa77b81da9ef4f41";

// 🔧 BACKGROUND TASK
void callbackDispatcher() {
  Workmanager().executeTask((task, inputData) async {
    await checkForUpdateBackground();
    return Future.value(true);
  });
}

// 🔍 FUNCIÓN DE VERIFICACIÓN
Future<void> checkForUpdateBackground() async {
  try {
    final response = await Dio().get(updateUrl);
    final data = response.data["record"];

    final packageInfo = await PackageInfo.fromPlatform();
    final currentVersion = int.parse(packageInfo.buildNumber);
    final serverVersion = data["versionCode"];

    final prefs = await SharedPreferences.getInstance();
    final lastNotifiedVersion = prefs.getInt("last_notified") ?? 0;

    if (serverVersion > currentVersion &&
        serverVersion != lastNotifiedVersion) {
      await showUpdateNotification();

      await prefs.setInt("last_notified", serverVersion);
    }
  } catch (e) {
    print("Error verificando actualización: $e");
  }
}

// 🔔 MOSTRAR NOTIFICACIÓN
Future<void> showUpdateNotification() async {
  const AndroidNotificationDetails androidDetails =
      AndroidNotificationDetails(
    'update_channel',
    'Actualizaciones',
    importance: Importance.high,
    priority: Priority.high,
  );

  const NotificationDetails notificationDetails =
      NotificationDetails(android: androidDetails);

  await notificationsPlugin.show(
    0,
    'Nueva actualización disponible',
    'Toca para actualizar tu app',
    notificationDetails,
  );
}

// 🚀 MAIN
void main() async {
  WidgetsFlutterBinding.ensureInitialized();

  // 🔔 Inicializar notificaciones
  const AndroidInitializationSettings androidSettings =
      AndroidInitializationSettings('@mipmap/ic_launcher');

  const InitializationSettings initSettings =
      InitializationSettings(android: androidSettings);

  await notificationsPlugin.initialize(initSettings);

  // ⚙️ Inicializar Workmanager
  Workmanager().initialize(callbackDispatcher, isInDebugMode: false);

  // ⏱ Ejecutar cada 6 horas
  Workmanager().registerPeriodicTask(
    "checkUpdateTask",
    "checkUpdate",
    frequency: const Duration(hours: 6),
  );

  runApp(const MyApp());
}

// 🎨 APP BASE
class MyApp extends StatelessWidget {
  const MyApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'Three Skulls Tattoo',
      home: const HomePage(),
    );
  }
}

// 🏠 PANTALLA PRINCIPAL (ejemplo simple)
class HomePage extends StatelessWidget {
  const HomePage({super.key});

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(title: const Text("Three Skulls Tattoo")),
      body: Center(
        child: ElevatedButton(
          onPressed: () async {
            await checkForUpdateBackground();
          },
          child: const Text("Buscar actualización"),
        ),
      ),
    );
  }
}
