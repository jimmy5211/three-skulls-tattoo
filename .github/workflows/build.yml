name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Setup Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/three-skulls.jks
          printf "storePassword=${{ secrets.KEYSTORE_PASSWORD }}\nkeyPassword=${{ secrets.KEY_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nstoreFile=three-skulls.jks\n" > android/key.properties

      - name: Configure Gradle signing
        run: |
          if ! grep -q "signingConfigs" android/app/build.gradle; then
            python3 << 'EOF'
          import re
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()
          signing_config = """
              signingConfigs {
                  release {
                      def keystorePropertiesFile = rootProject.file("key.properties")
                      def keystoreProperties = new Properties()
                      keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                  }
              }
          """
          content = content.replace('android {', 'android {' + signing_config, 1)
          content = re.sub(r'buildTypes \{', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }', content, count=1)
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print("Signing configured")
          EOF
          fi

      - name: Set version code
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          VERSION_CODE=$((1000 + BUILD_NUMBER))
          VERSION_NAME="1.0.$BUILD_NUMBER"
          sed -i "s/^version: .*/version: $VERSION_NAME+$VERSION_CODE/" pubspec.yaml
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BUILD_TOOLS/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Three Skulls Tattoo v1.0.${{ github.run_number }}"
          body: |
            ## 💀 Three Skulls Tattoo
            ### Versión 1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

      - name: Update JSONBin version
        run: |
          curl -X PUT \
            https://api.jsonbin.io/v3/b/69b8b65eaa77b81da9ef4f41 \
            -H 'Content-Type: application/json' \
            -H 'X-Master-Key: ${{ secrets.JSONBIN_API_KEY }}' \
            -d "{\"version\": \"1.0.${{ github.run_number }}\", \"versionCode\": $((1000 + ${{ github.run_number }})), \"downloadUrl\": \"https://github.com/jimmy5211/three-skulls-tattoo/releases/download/v1.0.${{ github.run_number }}/app-release.apk\", \"mandatory\": false}"

      - name: Send FCM push notification
        env:
          FCM_SA_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          pip install google-auth requests --quiet
          python3 -c "
import json, os
import google.auth.transport.requests
from google.oauth2 import service_account
import urllib.request

sa_info = json.loads(os.environ['FCM_SA_JSON'])
creds = service_account.Credentials.from_service_account_info(
    sa_info,
    scopes=['https://www.googleapis.com/auth/firebase.messaging']
)
creds.refresh(google.auth.transport.requests.Request())

version = '1.0.' + os.environ['RUN_NUMBER']
body = json.dumps({
    'message': {
        'topic': 'updates',
        'notification': {
            'title': '💀 Three Skulls ' + version + ' disponible',
            'body': 'Nueva versión lista. Toca para actualizar.'
        },
        'android': {'priority': 'HIGH'}
    }
}).encode('utf-8')

req = urllib.request.Request(
    'https://fcm.googleapis.com/v1/projects/three-skulls-tattoo-e4099/messages:send',
    data=body,
    headers={
        'Authorization': 'Bearer ' + creds.token,
        'Content-Type': 'application/json'
    }
)
resp = urllib.request.urlopen(req)
print('FCM sent:', resp.status)
"
