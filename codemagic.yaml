workflows:
  android-workflow:
    name: Three Skulls Tattoo - Android
    max_build_duration: 60
    environment:
      flutter: 3.16.9
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --suppress-analytics
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - jimmyula52@gmail.com
        notify:
          success: true
          failure: true
